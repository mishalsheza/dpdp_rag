# Overrides for the load test: DPDP_CONFIG_OVERRIDES=loadtest.yaml uv run dpdp-api
# Measures the serving path (API + embedding + Qdrant + BM25 + fusion + prompt building)
# without paying for, or waiting on, a real LLM. Every answer says it is a stub.
llm:
  provider: stub
  stub_latency_ms: 0  # set e.g. 1500 to simulate model latency
qdrant:
  location: ":memory:"
  auto_index: true
api:
  response_cache:
    enabled: false  # measure real work, not cache hits
metrics:
  db_path: data/cache/loadtest_metrics.db
tracing:
  langfuse_enabled: false
