# Retrieval configuration. Every option used by dpdp_rag.retrieval is set here.
data:
  chunks_file: data/processed/chunks.jsonl

qdrant:
  # If the env var named by url_env is set (e.g. a Qdrant Cloud URL), it is used together
  # with the API key from api_key_env. Otherwise `location` (":memory:" or a local path)
  # is used when set, else `local_url` (the docker-compose instance).
  url_env: QDRANT_URL
  api_key_env: QDRANT_API_KEY
  local_url: http://localhost:6333
  location: null
  collection: dpdp_chunks
  # Build the collection on first use if it is missing or out of date with chunks_file.
  auto_index: false
  upsert_batch_size: 64
  # Payload fields indexed in Qdrant for filtering.
  keyword_indexes: [doc_type, rule, section, sub_section, schedule, chunk_id]
  integer_indexes: [in_force_int]

embedding:
  provider: fastembed  # fastembed | hash (hash: offline, deterministic, for tests only)
  model: BAAI/bge-small-en-v1.5
  dim: null  # required for provider "hash"; read from the model otherwise
  batch_size: 32
  # What gets embedded for each chunk. Fields are chunk metadata; missing ones render empty.
  document_template: "{title}\n{text}"
  # Truncate each chunk's indexed text (dense and BM25) to this many characters; null = all.
  # A small value is the "bad chunk size" regression used in docs/CI_DEMO.md.
  index_max_chars: null
  # On-disk embedding cache keyed by model + exact text (enabled in CI by configs/ci.yaml).
  cache:
    enabled: false
    path: data/cache/embeddings.sqlite

bm25:
  k1: 1.5
  b: 0.75
  # Tokens kept: lowercase alphanumerics. Stopwords are removed.
  stopwords: [a, an, and, are, as, at, be, by, for, from, has, in, is, it, its, of, on, or,
              such, that, the, this, to, under, was, which, with, shall, any, may]

retrieval:
  mode: hybrid  # dense | bm25 | hybrid
  k: 5
  candidates: 50  # results taken from each retriever before fusion / reranking
  rrf_k: 60  # reciprocal rank fusion constant: score = sum(1 / (rrf_k + rank))

# Query rewriting before retrieval (retrieval/rewrite.py). One LLM call restates the
# question in the Act's terminology and lists sub-issues; each query is ranked and the
# rankings are fused with RRF. off | replace | fuse | decompose | fuse_decompose
query_rewrite:
  # fuse won the 2026-10-10 ablation (docs/DECISIONS.md D9): scenario recall@5 0.05->0.31
  # with no regression elsewhere beyond one-item noise. decompose helped scenario more
  # but regressed lookup / cross_reference / table.
  strategy: fuse
  max_sub_issues: 4
  # Total RRF weight shared by the sub-issue rankings (the original and the restatement
  # weigh 1 each), so many sub-issues cannot outvote the question itself.
  sub_issue_weight: 1.0
  # On an LLM failure, retrieve with the original query (logged) instead of failing.
  fallback_on_error: true
  prompt_files:
    system: prompts/query_rewrite.md
    user: prompts/query_rewrite_user.md
    schema: prompts/query_rewrite_schema.json
  # A smaller model than the answerer: the task is short, it adds latency to every query,
  # and Groq's free-tier daily token limit is per model.
  llm:
    provider: groq
    model: openai/gpt-oss-20b
    temperature: 0
    reasoning_effort: low
    max_tokens: 1500
    timeout_s: 30
    max_retries: 6
    pricing: {input: 0, output: 0, long_context_threshold: 1000000000, long_input: 0,
              long_output: 0, cache_write_multiplier: 1.0, cache_read_multiplier: 1.0}
  # Identical questions reuse the stored rewrite (also makes ablations reproducible).
  cache:
    enabled: true
    path: data/cache/llm_calls.sqlite

# Metadata boosts (retrieval/boost.py): extra rankings from the query and chunk metadata,
# fused with the candidates by weighted RRF. A weight of 0 turns a signal off.
boost:
  # Measured 2026-10-10 (docs/DECISIONS.md D10): all but links on.
  weights:
    citations: 1  # "Section 8(5)", "rule 1(3)", "item 11 of Part B of the First Schedule"
    definitions: 1  # "what counts as 'personal data'" -> the defining clause
    commencement: 1  # "when do the Rules come into force" -> commencement provisions
    corrections: 1  # corrigendum chunk <-> the chunk it corrected
    links: 0  # Schedule row <-> parent rule / Act section: raised table recall, cost MRR
  rrf_k: 60
  depth: 10  # top candidates the corrections signal looks at
  citations:
    max_chunks: 5  # skip a citation resolving to more chunks (e.g. a whole Schedule)
  links:
    depth: 5  # top candidates whose Schedule / parent links are added
  definitions:
    # Without a quoted term, the question must ask for a meaning to boost a definition.
    intent_patterns: ['\bwhat (?:counts as|is meant by)\b', '\bmeaning of\b',
                      '\bdefinition of\b', '\bdefines?\b', '\bwhat does .{1,60} mean\b']
  commencement:
    intent_patterns: ['\b(?:come|comes|came|coming) into (?:force|effect)\b',
                      '\bcommencement\b', '\bcommence[sd]?\b',
                      '\beffective (?:from|date)\b']
    # Not plain "in force": "is rule 7 in force today?" asks about rule 7, not rule 1.
    title_patterns: ['commencement']  # chunk titles of commencement provisions
    # A query naming exactly one of these narrows to its document types.
    doc_targets:
      rules: [rules]
      act: [act, notification]  # the Act's commencement is notified by G.S.R. 843(E)
  corrections:
    intent_patterns: ['\bcorrect(?:ed|ion|ions|s)?\b', '\bcorrigend', '\berrat',
                      '\bG\.?\s?S\.?\s?R\.?\s*892']

reranker:
  enabled: false
  provider: fastembed
  model: Xenova/ms-marco-MiniLM-L-6-v2
  top_n: 20  # how many fused candidates are rescored
  document_template: "{title}\n{text}"

filters:
  doc_type: null  # act | rules | notification | corrigendum, or a list
  rule: null  # e.g. "12"
  section: null  # e.g. "9"
  in_force_only: false  # keep chunks with in_force_date <= today
  today: null  # ISO date overriding the system date for in_force_only

cross_refs:
  enabled: true
  # For each retrieved chunk, fetch the Act chunks named in its refers_to_provisions
  # (e.g. rule 12(1) -> section 9(1), 9(3)).
  max_per_chunk: 4
  # An expanded chunk scores parent_score * score_factor.
  score_factor: 0.5
  # Which filters also apply to expanded chunks (doc_type/rule/section would remove the
  # referenced Act sections, so only the date filter applies by default).
  apply_in_force_filter: true

llm:
  provider: groq  # needs GROQ_API_KEY; `anthropic` is still supported but unused
  model: openai/gpt-oss-120b  # supports strict json_schema structured outputs on Groq
  max_tokens: 8000  # includes reasoning tokens
  reasoning_effort: medium  # gpt-oss: low / medium / high
  timeout_s: 60
  max_retries: 2
  # USD per 1M tokens. Groq free tier: rate-limited, not billed, so every cost is $0.
  pricing:
    input: 0
    output: 0
    # Prompts larger than this many input tokens are billed at the long-context rates.
    long_context_threshold: 1000000000  # Groq has no long-context tier
    long_input: 0
    long_output: 0
    cache_write_multiplier: 1.0
    cache_read_multiplier: 1.0

generation:
  k: 8  # chunks retrieved per question (cross-referenced chunks are added on top)
  prompt_files:
    system: prompts/answer_system.md
    user: prompts/answer_user.md
    insufficient_context: prompts/refusal_insufficient_context.md
    schema: prompts/answer_schema.json
  # How a Schedule entry is named in pinpoints, by schedule.
  schedule_entry_label:
    The Schedule: row
    First Schedule: item
    Second Schedule: clause
    Third Schedule: row
    Fourth Schedule: row
    Fifth Schedule: paragraph
    Sixth Schedule: paragraph
    Seventh Schedule: row
  doc_labels:
    act: Digital Personal Data Protection Act, 2023
    rules: Digital Personal Data Protection Rules, 2025 (G.S.R. 846(E))
    notification: Notification
    corrigendum: Corrigendum G.S.R. 892(E)

api:
  host: 127.0.0.1
  port: 8000
  max_question_chars: 2000
  response_cache:
    enabled: true  # dev only: replay identical (question, as_of_date, config_hash) answers
    dir: data/cache/responses

metrics:
  db_path: data/metrics.db

tracing:
  # Langfuse is used when enabled and LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY are set
  # (LANGFUSE_HOST selects the server); otherwise tracing is a no-op.
  langfuse_enabled: true
  trace_name: ask

ui:
  # Where the Streamlit chat page sends questions; $DPDP_API_URL overrides it.
  api_url: http://127.0.0.1:8000
  request_timeout_s: 120
  # Eval history read by the dashboard (one results.json per run directory).
  eval_runs_dir: data/eval_runs
