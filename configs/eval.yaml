# Evaluation configuration (dpdp_rag.eval). The system under test is configured by
# `system_config`; this file configures the golden set, metrics and the judge.
golden_file: data/golden.jsonl
system_config: default.yaml
output_dir: data/eval_runs

categories: [lookup, cross_reference, table, temporal, corrigendum, scenario, unanswerable,
             prompt_injection]

retrieval:
  ks: [1, 3, 5]  # recall@k and hit_rate@k
  mrr_depth: 10  # ranks considered for MRR; a gold chunk below this counts as 0

judge:
  # Groq free tier, temperature 0 for reproducible judging. gpt-oss-20b, not the 120b
  # answerer: it supports strict structured outputs, has its own daily token limit (the
  # 120b one is spent on answers), and avoids the answerer grading itself. Compare with
  # the 120b judge via configs/judge_120b.yaml (docs/DECISIONS.md D12).
  provider: groq
  model: openai/gpt-oss-20b
  temperature: 0
  reasoning_effort: low
  # Includes reasoning tokens. Groq's free tier allows 8000 tokens/min and counts this cap
  # against it, so keep it modest; a low-effort verdict uses a few hundred tokens.
  max_tokens: 2000
  timeout_s: 60
  # The Groq SDK waits out 429s using the retry-after header; the free-tier TPM limit
  # needs more than the default 2 retries over a 30-item run.
  max_retries: 8
  # One real judge call before the run; if it fails the run aborts (exit 3) instead of
  # writing a results file with no answer-quality metrics.
  preflight: true
  # Categories also graded on whether the injected instruction was resisted (pass/fail).
  injection_categories: [prompt_injection]
  pass_threshold: 4  # a 1-5 score >= this counts as a pass
  pricing:  # USD per 1M tokens; free tier, so $0
    input: 0
    output: 0
    long_context_threshold: 1000000000
    long_input: 0
    long_output: 0
    cache_write_multiplier: 1.0
    cache_read_multiplier: 1.0
  prompt_files:
    faithfulness: prompts/judge_faithfulness.md
    relevance: prompts/judge_relevance.md
    refusal: prompts/judge_refusal.md
    injection: prompts/judge_injection.md
    input: prompts/judge_input.md
    score_schema: prompts/judge_score_schema.json
    refusal_schema: prompts/judge_refusal_schema.json

# As-of date for golden items without one; null = the run date. CI pins it so results
# stay comparable with the baseline over time.
default_as_of_date: null

# Disk cache of LLM calls (answers and judge), keyed by model, parameters and the exact
# prompts. Identical requests are replayed for free; enabled in CI by configs/ci.yaml.
llm_cache:
  enabled: false
  path: data/cache/llm_calls.sqlite

# Cap on uncached (billed) LLM spend per run, in USD; null = no cap.
budget_usd: null

tracing:
  trace_name: eval_run
