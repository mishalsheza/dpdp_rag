[project]
name = "dpdp-rag"
version = "0.1.0"
description = "RAG over India's Digital Personal Data Protection Act, 2023 and DPDP Rules, 2025"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "qdrant-client>=1.19.1",
    "fastembed>=0.9.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.2.4",
    "anthropic>=1.12.1",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "langfuse>=4.17.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.5",
]
load = [
    "locust>=2.46.7",
]
ui = [
    "streamlit>=1.65.0",
]

[project.scripts]
dpdp-ingest = "dpdp_rag.ingest.pipeline:main"
dpdp-index = "dpdp_rag.retrieval.index:main"
dpdp-retrieve = "dpdp_rag.retrieval.__main__:main"
dpdp-api = "dpdp_rag.api.__main__:main"
dpdp-eval = "dpdp_rag.eval.cli:main"
dpdp-eval-coverage = "dpdp_rag.eval.coverage:main"
dpdp-eval-gate = "dpdp_rag.eval.gates:main"
dpdp-eval-baseline = "dpdp_rag.eval.baseline:main"
dpdp-ablation = "dpdp_rag.eval.ablation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dpdp_rag"]

[tool.uv]
# `uv sync` (and CI) installs the dev and ui groups; locust is opt-in (--group load).
default-groups = ["dev", "ui"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
