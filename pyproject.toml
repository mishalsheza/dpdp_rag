[project]
name = "dpdp-rag"
version = "0.1.0"
description = "RAG over India's Digital Personal Data Protection Act, 2023 and DPDP Rules, 2025"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
dpdp-ingest = "dpdp_rag.ingest.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dpdp_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
